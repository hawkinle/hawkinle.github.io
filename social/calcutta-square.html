<!DOCTYPE html>
<html lang="en">
<!-- Rendered to social/calcutta-post-square.png (1080x1080) via headless screenshot. -->
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Calcutta social — square</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: 'Outfit', sans-serif;
    background: #0a0e14;
    color: #f8f9fa;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 15% 8%, rgba(232,196,106,0.20) 0%, rgba(232,196,106,0) 45%),
      radial-gradient(circle at 88% 95%, rgba(255,69,0,0.22) 0%, rgba(255,69,0,0) 50%);
  }
  .frame {
    position: absolute; inset: 34px;
    border: 2px solid rgba(232,196,106,0.55);
    border-radius: 40px;
  }
  .inner {
    position: absolute; inset: 0;
    padding: 92px 96px 84px;
    display: flex; flex-direction: column; justify-content: space-between;
    text-align: center;
  }
  .club {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 25px; font-weight: 600;
    letter-spacing: 8px; text-transform: uppercase;
    color: #E8C46A;
  }
  .badge {
    display: inline-block;
    margin: 0 auto 30px;
    font-size: 24px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: #16130a;
    background: linear-gradient(135deg, #E8C46A, #f0d894);
    padding: 14px 34px; border-radius: 100px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 118px; line-height: 0.94; font-weight: 700;
    letter-spacing: -3px; text-transform: uppercase;
  }
  h1 .gold { color: #E8C46A; }
  .tagline {
    font-size: 40px; font-weight: 600; color: #fff; margin-top: 26px;
  }
  .sub { font-size: 30px; color: #c7cdd3; margin-top: 12px; font-weight: 300; }
  .divider { height: 2px; background: rgba(232,196,106,0.35); margin: 44px 0; }
  .details { display: flex; justify-content: center; gap: 26px; }
  .detail {
    flex: 1;
    background: rgba(232,196,106,0.09);
    border: 1px solid rgba(232,196,106,0.3);
    border-radius: 20px; padding: 22px 14px;
  }
  .detail .k {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 38px; font-weight: 700; color: #E8C46A; display: block;
  }
  .detail .v {
    font-size: 21px; letter-spacing: 1px; text-transform: uppercase;
    color: #c7cdd3; margin-top: 6px;
  }
  .foot {
    font-size: 25px; color: #c7cdd3; letter-spacing: 0.5px;
  }
  .foot strong { color: #fff; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="inner">
    <div>
      <div class="club">Upper Horton Sports Club</div>
    </div>

    <div>
      <div class="badge">🏇 Sunday 1 November 2026</div>
      <h1>Melbourne Cup<br><span class="gold">Calcutta</span></h1>
      <div class="tagline">Get your syndicates together.</div>
      <div class="sub">Meals and syndicate tickets from 12 · auction from about 3 PM</div>
    </div>

    <div>
      <div class="divider"></div>
      <div class="details">
        <div class="detail"><span class="k">12:00</span><span class="v">Meals &amp; tickets</span></div>
        <div class="detail"><span class="k">3 PM</span><span class="v">Auction</span></div>
        <div class="detail"><span class="k">Tue 3 Nov</span><span class="v">Cup Day</span></div>
      </div>
      <div class="foot" style="margin-top: 40px;">
        <strong>22 Cobbadah Street, Upper Horton NSW</strong> · (02) 6782 7249
      </div>
    </div>
  </div>
</body>
</html>
